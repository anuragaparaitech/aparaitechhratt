<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Aparaitech HRMS | Enterprise Attendance Portal</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a192f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Aparaitech">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>
      // Self-healing recovery for stale browser caches or outdated script hashes
      window.addEventListener('error', function(e) {
        var isChunkError = e.message && (
          e.message.indexOf('Loading chunk') !== -1 ||
          e.message.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          e.message.indexOf('Importing a module script failed') !== -1
        );
        var isScriptLoadError = e.target && e.target.tagName === 'SCRIPT';
        if (isChunkError || isScriptLoadError) {
          if (!sessionStorage.getItem('aparaitech_reloaded_for_chunk')) {
            sessionStorage.setItem('aparaitech_reloaded_for_chunk', 'true');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) regs[i].unregister();
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var i = 0; i < names.length; i++) caches.delete(names[i]);
              });
            }
            window.location.reload(true);
          }
        }
      }, true);
      window.addEventListener('load', function() {
        setTimeout(function() {
          sessionStorage.removeItem('aparaitech_reloaded_for_chunk');
        }, 3000);
      });
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update();
          }).catch(function(err) {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
</body>
</html>
