<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aparaitech Work Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 360px;
      background: #0f172a;
      color: #ffffff;
      padding: 16px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo-badge {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
    }

    .header-text h1 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    .header-text p {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      color: #34d399;
      font-weight: 600;
      margin: 14px 0 12px 0;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
    }

    .main-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .main-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.5);
    }

    .main-btn:active {
      transform: translateY(0);
    }

    .tab-btn {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      transition: background 0.15s;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .quick-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin: 14px 0 8px 0;
    }

    .grid-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .action-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 0.15s, background 0.15s;
    }

    .action-card:hover {
      border-color: #3b82f6;
      background: #253349;
    }

    .action-card .icon {
      font-size: 16px;
      margin-bottom: 2px;
    }

    .action-card .title {
      font-size: 12px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .action-card .sub {
      font-size: 10px;
      color: #94a3b8;
    }

    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #64748b;
    }

    .footer a {
      color: #60a5fa;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">🏢</div>
    <div class="header-text">
      <h1>Aparaitech Software</h1>
      <p>Company Work & Attendance Portal</p>
    </div>
  </div>

  <div class="status-pill">
    <span class="status-dot"></span>
    <span>Live at aparaitechhratt.vercel.app</span>
  </div>

  <button class="main-btn" id="launchAppBtn">
    <span>💻</span>
    <span>Launch Desktop App Window</span>
  </button>

  <button class="tab-btn" id="openTabBtn">
    <span>🌐</span>
    <span>Open in Browser Tab</span>
  </button>

  <div class="quick-title">Quick Actions</div>
  <div class="grid-actions">
    <div class="action-card" id="actAttendance">
      <div class="icon">📍</div>
      <div class="title">Mark Attendance</div>
      <div class="sub">Face & GPS Geofence</div>
    </div>
    <div class="action-card" id="actDailyReport">
      <div class="icon">📝</div>
      <div class="title">Daily Report</div>
      <div class="sub">Calls & Metric logs</div>
    </div>
    <div class="action-card" id="actConversions">
      <div class="icon">💰</div>
      <div class="title">Log Conversion</div>
      <div class="sub">₹6,000 Product Sale</div>
    </div>
    <div class="action-card" id="actPipeline">
      <div class="icon">📊</div>
      <div class="title">Pipeline Tracker</div>
      <div class="sub">7-Day Follow-Ups</div>
    </div>
  </div>

  <div class="footer">
    <span>v1.0.0 • Production</span>
    <a href="https://aparaitechhratt.vercel.app/" target="_blank" id="footerLink">Visit Portal ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
